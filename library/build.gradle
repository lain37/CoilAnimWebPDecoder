plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace = 'com.github.skgmn.webpdecoder'
    compileSdk = 37
    ndkVersion = '30.0.16138531'

    defaultConfig {
        minSdk = 23

        consumerProguardFiles 'consumer-rules.pro'
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_4
    }
}

dependencies {
    api 'io.coil-kt.coil3:coil-gif:3.6.0'
    implementation 'io.coil-kt.coil3:coil-core:3.6.0'
    implementation 'androidx.vectordrawable:vectordrawable-animated:1.2.0'
}

afterEvaluate {
    publishing {
        repositories {
            maven {
                url = uri("https://maven.pkg.github.com/${findProperty('GITHUB_ID') ?: 'lain37'}/CoilAnimWebPDecoder")
                credentials {
                    username = findProperty('GITHUB_ID') ?: System.getenv('GITHUB_ID')
                    password = findProperty('GITHUB_PACKAGES_TOKEN') ?: System.getenv('GITHUB_PACKAGES_TOKEN')
                }
            }
        }
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.skgmn'
                artifactId = 'animatedwebpdecoder'
                version = '0.1.4'
            }
        }
    }
}
